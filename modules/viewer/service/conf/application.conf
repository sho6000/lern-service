## Pekko
# https://www.playframework.com/documentation/latest/JavaPekko#Configuration
# ~~~~~
pekko {
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  loglevel = "INFO"
  stdout-loglevel = "DEBUG"
  logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"
  log-config-on-start = off

  actor {
    provider = "org.apache.pekko.actor.LocalActorRefProvider"
    serializers {
      java = "org.apache.pekko.serialization.JavaSerializer"
    }
    serialization-bindings {
      "org.sunbird.request.Request" = java
      "org.sunbird.response.Response" = java
    }
    default-dispatcher {
      # This will be used if you have set "executor = "fork-join-executor""
      fork-join-executor {
        # Min number of threads to cap factor-based parallelism number to
        parallelism-min = 8

        # The parallelism factor is used to determine thread pool size using the
        # following formula: ceil(available processors * factor). Resulting size
        # is then bounded by the parallelism-min and parallelism-max values.
        parallelism-factor = 32.0

        # Max number of threads to cap factor-based parallelism number to
        parallelism-max = 64

        # Setting to "FIFO" to use queue like peeking mode which "poll" or "LIFO" to use stack
        # like peeking mode which "pop".
        task-peeking-mode = "FIFO"
      }
    }
    tracking-dispatcher {
      type = "Dispatcher"
      executor = "fork-join-executor"
      fork-join-executor {
        parallelism-min = 8
        parallelism-factor = 32.0
        parallelism-max = 64
      }
      # Throughput for default Dispatcher, set to 1 for as fair as possible
      throughput = 1
    }
    rr-dispatcher {
      type = "Dispatcher"
      executor = "fork-join-executor"
      fork-join-executor {
        parallelism-min = 8
        parallelism-factor = 32.0
        parallelism-max = 64
      }
      # Throughput for default Dispatcher, set to 1 for as fair as possible
      throughput = 1
    }
    deployment {
        /view-consumption-actor
         {
           router = smallest-mailbox-pool
           nr-of-instances = 4
           dispatcher = tracking-dispatcher
         }
        # viewer-aggregator-actor is bound programmatically in ActorStartModule with a
        # ConsistentHashingPool + hashMapper keyed on userId (per-user serialization).
        # No deployment entry here: config FromConfig cannot supply a hash key.
        /viewer-summary-actor
         {
           router = smallest-mailbox-pool
           nr-of-instances = 4
           dispatcher = rr-dispatcher
         }
    }
  }
}

## Internationalisation
# https://www.playframework.com/documentation/latest/JavaI18N
# ~~~~~
play.i18n {
  # The application languages
  langs = [ "en" ]
}

## Play HTTP settings
# ~~~~~
play.http {
  ## Router
  # https://www.playframework.com/documentation/latest/JavaRouting
  # https://www.playframework.com/documentation/latest/ScalaRouting
  # ~~~~~
  # Define the Router object to use for this application.
  # This router will be looked up first when the application is starting up,
  # so make sure this is the entry point.
  # Furthermore, it's assumed your route file is named properly.
  # So for an application router like `my.application.Router`,
  # you may need to define a router file `conf/my.application.routes`.
  # Default to Routes in the root package (aka "apps" folder) (and conf/routes)
  #router = my.application.Router
  #TO allow more data in request body
  errorHandler = modules.ErrorHandler
  actionCreator = modules.OnRequestHandler
  parser {
    maxMemoryBuffer = 50MB
    maxDiskBuffer = 50MB
  }
  secret.key="courseservicenadnfrfnsdmcvdfjbnfrsjfksdvcsdnfvdsfjkrvhsmdv"
}

## Netty Provider
# ~~~~~
play.server {

  provider = "play.core.server.NettyServerProvider"

  netty {
    # The number of event loop threads. 0 means let Netty decide, which by default will select 2 times the number of
    # available processors.
    eventLoopThreads = 30

    log.wire = true

    # The transport to use, either jdk or native.
    # Native socket transport has higher performance and produces less garbage but are only available on linux
    transport = "native"

    # If you run Play on Linux, you can use Netty's native socket transport
    # for higher performance with less garbage.
    #transport = "native"
    maxChunkSize = 30000000
    option {

      # Set whether connections should use TCP keep alive
      child.SO_KEEPALIVE = true

      # Set whether the TCP no delay flag is set
      # child.tcpNoDelay = false

      # Set the size of the backlog of TCP connections.  The default and exact meaning of this parameter is JDK specific.
      # backlog = 100
    }

    http {
      # The idle timeout for an open connection after which it will be closed
      # Set to null or "infinite" to disable the timeout, but notice that this
      # is not encouraged since timeout are important mechanisms to protect your
      # servers from malicious attacks or programming mistakes.
      idleTimeout = infinite
    }
  }
}

## WS (HTTP Client)
# ~~~~~
libraryDependencies += javaWs

AuthenticationEnabled=true

## Cache
# https://www.playframework.com/documentation/latest/JavaCache
# https://www.playframework.com/documentation/latest/ScalaCache
# ~~~~~
# Play comes with an integrated cache API that can reduce the operational
# overhead of repeated requests. You must enable this by adding to build.sbt:
#
libraryDependencies += cache
#
play.cache {
  # If you want to bind several caches, you can bind the individually
  #bindCaches = ["db-cache", "user-cache", "session-cache"]
}

# Logger
# ~~~~~
# You can also configure logback (http://logback.qos.ch/),
# by providing an application-logger.xml file in the conf directory.

# Root logger:
#logger.root=ERROR

# Logger used by the framework:
#logger.play=INFO

# Logger provided to your application:
#logger.application=DEBUG

# APP Specific config
# ~~~~~
# Application specific configurations can be provided here
play.modules {
  enabled += modules.StartModule
  enabled += modules.ActorStartModule
  enabled += modules.StorageModule
}

play.filters {
  hosts {
    # Allow requests to example.com, its subdomains, and localhost:9000.
    allowed = ["localhost:9000","."]
  }
  enabled += filters.AccessLogFilter
  enabled += filters.CustomGzipFilter
  enabled += filters.ResponseFilter
  disabled += play.filters.csrf.CSRFFilter
}
# Assessment Aggregator Configuration
assessment_direct_aggregation_enabled=true
kafka_assessment_topic="sunbird.assessment.raw"
kafka_topics_contentstate_invalid="sunbird.contentstate.invalid"
assessment_skip_missing_records=true

# Redis optional support — master switch
# When false (default), Redis is not required. All Redis use cases are either skipped or fall back to in-memory alternatives.
redis.enabled = false
# Viewer module — Cassandra configuration
sunbird_course_keyspace = "sunbird_courses"
assessment_aggregator_table = "assessment_aggregator"
user_activity_agg_table = "user_activity_agg"

# Feature flags
viewer_enabled = true
assessment_direct_aggregation_enabled = true
user_activity_agg_enabled = true

# Viewer dispatcher (for aggregator pool)
pekko.actor.viewer-dispatcher {
  type = Dispatcher
  executor = "thread-pool-executor"
  thread-pool-executor {
    core-pool-size-min = 8
    core-pool-size-max = 64
    max-pool-size-max = 128
    queue-size = -1
  }
  throughput = 1
}
